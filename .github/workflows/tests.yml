name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: python -m pip install -r requirements-dev.txt
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: python -m analysis.catalog --check
      - run: python -m analysis.build_english --check
      - run: npm test
      - name: Start local API
        run: |
          python -m analysis.serve_dashboard --port 8768 > api.log 2>&1 &
          python -c "import time,urllib.request; time.sleep(2); urllib.request.urlopen('http://127.0.0.1:8768/api/health')"
      - run: python -m pytest -q
        env:
          PADLOCK_TEST_URL: http://127.0.0.1:8768
      - run: npm run test:browser
        env:
          PADLOCK_TEST_URL: http://127.0.0.1:8768
